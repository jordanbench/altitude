<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="Bar chart, drawn to scale. Words you read before you can stop, for the git rebase example. 10k view only: 184 words, under 1 minute. Through the 5k view: 692 words, about 3 minutes. Through the 1k view: 1,295 words, about 5 minutes. All four views: 3,021 words, about 13 minutes. The same answer as one long reply: 3,742 words, about 16 minutes.">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{font-size:28px;font-weight:700;fill:#15202b}
    .k{font-size:19px;font-weight:600;fill:#15202b}
    .v{font-size:17px;fill:#15202b}
    .w{font-size:17px;font-weight:600;fill:#ffffff}
    .s{font-size:14px;fill:#566475}
  </style>
  <rect width="960" height="440" rx="20" fill="#f3f5f7"/>
  <text x="40" y="54" class="t h">Same answer. Read only as deep as you need.</text>
  <text x="40" y="84" class="t s">WORDS YOU READ BEFORE YOU CAN STOP</text>

  <!-- scale: 620px = 3,742 words; bars start at x=270 -->
  <line x1="270" y1="104" x2="270" y2="384" stroke="#d8dee5" stroke-width="2"/>

  <text x="250" y="132" text-anchor="end" class="t k">10k view only</text>
  <rect x="270" y="110" width="31" height="34" rx="5" fill="#0b6e8a"/>
  <text x="313" y="133" class="t v">184 words · under 1 min</text>

  <text x="250" y="188" text-anchor="end" class="t k">Through the 5k view</text>
  <rect x="270" y="166" width="115" height="34" rx="5" fill="#0b6e8a"/>
  <text x="397" y="189" class="t v">692 words · about 3 min</text>

  <text x="250" y="244" text-anchor="end" class="t k">Through the 1k view</text>
  <rect x="270" y="222" width="215" height="34" rx="5" fill="#7fb5c6"/>
  <text x="497" y="245" class="t v">1,295 words · about 5 min</text>

  <text x="250" y="300" text-anchor="end" class="t k">All four views</text>
  <rect x="270" y="278" width="501" height="34" rx="5" fill="#b9d3dc"/>
  <text x="783" y="301" class="t v">3,021 · 13 min</text>

  <text x="250" y="356" text-anchor="end" class="t k">One long answer</text>
  <rect x="270" y="334" width="620" height="34" rx="5" fill="#b4531c"/>
  <text x="285" y="357" class="t w">3,742 words · about 16 minutes</text>

  <text x="40" y="414" class="t s">Prose words in the git rebase example in this repo, not counting picture labels. Minutes at 238 words a minute,</text>
  <text x="40" y="432" class="t s">the average adult reading speed for nonfiction (Brysbaert, 2019). Bars are drawn to scale.</text>
</svg>
