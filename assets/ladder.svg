<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-label="Four views like altitudes. 10k view: What is it? One big picture. 5k view: How does it work? Connected parts. 1k view: What should we decide? A flow and a table. 100 view: Prove it. Charts and code.">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .lb{font-size:26px;font-weight:700;fill:#15202b}
    .q{font-size:22px;fill:#15202b}
    .s{font-size:16px;fill:#566475}
  </style>
  <rect width="960" height="470" rx="20" fill="#f3f5f7"/>
  <text x="40" y="46" class="t s">FOUR VIEWS OF THE SAME ANSWER</text>
  <line x1="70" y1="80" x2="70" y2="440" stroke="#d8dee5" stroke-width="4" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- 10k -->
  <rect x="110" y="66" width="820" height="78" rx="14" fill="#fff" stroke="#0b6e8a" stroke-width="3"/>
  <circle cx="70" cy="105" r="11" fill="#0b6e8a"/>
  <circle cx="190" cy="105" r="26" fill="#dcedf2" stroke="#0b6e8a" stroke-width="3"/>
  <text x="270" y="114" class="t lb">10k view</text><text x="905" y="114" text-anchor="end" class="t q">What is it?</text>
  <!-- 5k -->
  <rect x="110" y="160" width="820" height="78" rx="14" fill="#fff" stroke="#d8dee5" stroke-width="3"/>
  <circle cx="70" cy="199" r="11" fill="#566475"/>
  <g fill="#dcedf2" stroke="#0b6e8a" stroke-width="2"><rect x="150" y="176" width="28" height="20" rx="3"/><rect x="204" y="176" width="28" height="20" rx="3"/><rect x="177" y="208" width="28" height="20" rx="3"/></g>
  <g stroke="#566475" stroke-width="2"><line x1="178" y1="186" x2="204" y2="186"/><line x1="166" y1="196" x2="184" y2="208"/><line x1="216" y1="196" x2="198" y2="208"/></g>
  <text x="270" y="208" class="t lb">5k view</text><text x="905" y="208" text-anchor="end" class="t q">How does it work?</text>
  <!-- 1k -->
  <rect x="110" y="254" width="820" height="78" rx="14" fill="#fff" stroke="#d8dee5" stroke-width="3"/>
  <circle cx="70" cy="293" r="11" fill="#566475"/>
  <g fill="#dcedf2" stroke="#0b6e8a" stroke-width="2"><rect x="144" y="266" width="22" height="15" rx="2"/><rect x="184" y="266" width="22" height="15" rx="2"/><rect x="224" y="266" width="22" height="15" rx="2"/></g>
  <g stroke="#566475" stroke-width="2"><line x1="166" y1="273" x2="184" y2="273"/><line x1="206" y1="273" x2="224" y2="273"/></g>
  <g fill="none" stroke="#d8dee5" stroke-width="2"><rect x="144" y="290" width="102" height="30"/><line x1="144" y1="305" x2="246" y2="305"/><line x1="195" y1="290" x2="195" y2="320"/></g>
  <text x="270" y="302" class="t lb">1k view</text><text x="905" y="302" text-anchor="end" class="t q">What should we decide?</text>
  <!-- 100 -->
  <rect x="110" y="348" width="820" height="78" rx="14" fill="#fff" stroke="#d8dee5" stroke-width="3"/>
  <circle cx="70" cy="387" r="11" fill="#566475"/>
  <g fill="#0b6e8a"><rect x="144" y="384" width="9" height="26"/><rect x="157" y="370" width="9" height="40"/><rect x="170" y="390" width="9" height="20"/><rect x="183" y="364" width="9" height="46"/></g>
  <g fill="#566475"><rect x="202" y="366" width="46" height="5" rx="2"/><rect x="208" y="378" width="40" height="5" rx="2"/><rect x="202" y="390" width="46" height="5" rx="2"/><rect x="208" y="402" width="32" height="5" rx="2"/></g>
  <text x="270" y="396" class="t lb">100 view</text><text x="905" y="396" text-anchor="end" class="t q">Prove it.</text>
</svg>
