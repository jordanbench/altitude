<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" role="img" aria-label="Four steps going down. A reader starts on the 10k step and stops at the 5k step with a check mark. The lower steps are faded: only if you need them.">
  <style>
    .t{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{font-size:28px;font-weight:700;fill:#15202b}
    .s{font-size:18px;fill:#566475}
  </style>
  <rect width="960" height="340" rx="20" fill="#f3f5f7"/>
  <text x="40" y="52" class="t h">Start at the top. Go down only if you need to.</text>
  <rect x="40" y="130" width="200" height="22" rx="8" fill="#0b6e8a"/>
  <rect x="270" y="190" width="200" height="22" rx="8" fill="#0b6e8a"/>
  <rect x="500" y="250" width="200" height="22" rx="8" fill="#d8dee5"/>
  <rect x="730" y="300" width="200" height="22" rx="8" fill="#d8dee5"/>
  <text x="140" y="178" text-anchor="middle" class="t s">10k</text>
  <text x="370" y="238" text-anchor="middle" class="t s">5k</text>
  <text x="600" y="298" text-anchor="middle" class="t s">1k</text>
  <text x="830" y="292" text-anchor="middle" class="t s">100</text>
  <circle cx="140" cy="100" r="20" fill="#15202b"/>
  <path d="M168 100 C 250 100, 320 120, 356 166" stroke="#15202b" stroke-width="4" fill="none" stroke-dasharray="8 8" stroke-linecap="round"/>
  <circle cx="370" cy="168" r="20" fill="#15202b"/>
  <circle cx="432" cy="146" r="26" fill="#0b6e8a"/>
  <path d="M420 146 L430 156 L446 136" stroke="#ffffff" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="715" y="210" text-anchor="middle" class="t s">only if you need it</text>
</svg>
